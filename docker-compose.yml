# Stack entero: docker compose up -d --build   (backend + frontend)
#               FRONTEND_PORT=3000 docker compose up -d --build  (si el 8080 está ocupado)
services:
  backend:
    build: ./backend
    restart: unless-stopped
    # Reutiliza backend/.env si existe...
    env_file:
      - path: ./backend/.env
        required: false
    # ...y sobreescribe lo que cambia dentro de Docker
    environment:
      NODE_ENV: production
      PORT: 4000
      PUBLIC_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-8080}
    ports:
      - '4000:4000'

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-9090}:80'

