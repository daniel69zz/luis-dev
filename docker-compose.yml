# Desarrollo:   docker compose up -d db        (solo la base de datos)
# Stack entero: docker compose up -d --build   (db + backend + frontend)
#               FRONTEND_PORT=3000 docker compose up -d --build  (si el 8080 está ocupado)
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: portfolio
      POSTGRES_PASSWORD: portfolio
      POSTGRES_DB: portfolio
    ports:
      - '5433:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U portfolio -d portfolio']
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    # Reutiliza backend/.env si existe...
    env_file:
      - path: ./backend/.env
        required: false
    # ...y sobreescribe lo que cambia dentro de Docker
    environment:
      NODE_ENV: production
      PORT: 4000
      PUBLIC_URL: http://localhost:4000
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-8080}
      DATABASE_URL: postgresql://portfolio:portfolio@db:5432/portfolio?schema=public
    ports:
      - '4000:4000'
    volumes:
      - uploads:/app/uploads

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - '${FRONTEND_PORT:-8080}:80'

volumes:
  pgdata:
  uploads:
